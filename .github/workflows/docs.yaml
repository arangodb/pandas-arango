name: Docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    name: Docs

    services:
      arangodb:
        image: arangodb/core-preview:4.0-nightly
        env:
          ARANGO_ROOT_PASSWORD: passwd
        ports:
          - 8529:8529
        options: >-
          --health-cmd "wget --spider --quiet --tries=1
          --header='Authorization: Basic cm9vdDpwYXNzd2Q='
          http://127.0.0.1:8529/_api/version"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[docs]"

      - name: Build HTML documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Run Sphinx doctest
        env:
          PANDAS_ARANGO_TEST_PASSWORD: passwd
        run: python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest
