services:
  arangodb:
    image: arangodb/arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: passwd
    ports:
      - "8529:8529"
    healthcheck:
      test:
        - CMD
        - arangosh
        - --server.endpoint
        - tcp://127.0.0.1:8529
        - --server.username
        - root
        - --server.password
        - passwd
        - --javascript.execute-string
        - db._version()
      interval: 5s
      timeout: 5s
      retries: 20

